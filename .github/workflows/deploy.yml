name: Deploy Ledgerrection (Church Finance App)

on:
  push:
    branches:
      - main # 배포 대상 브랜치

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. pnpm 설치 및 환경 설정
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # 프로젝트에 맞는 pnpm 버전 지정

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Nuxt 3가 지원하는 LTS 버전
          cache: 'pnpm'  # pnpm 의존성 자동 캐싱

      # 3. 의존성 설치 및 빌드
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ledgerrection Application
        run: pnpm build # SSR 빌드 진행 (결과물은 .output 폴더에 생성됨)

      # 4. 빌드 결과물(.output)을 우분투 서버로 전송 (SCP)
      - name: Transfer Build Artifacts to Ledgerrection Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: ".output/*"
          target: "/var/www/ledgerrection" # 서버 내 배포할 경로
          strip_components: 0

      # 5. 우분투 서버에서 Node 배포 프로세스 재시작 (SSH)
      - name: Restart Ledgerrection via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /var/www/ledgerrection
            # PM2를 이용하여 Nuxt 3의 내장 Nitro 서버를 무중단 재시작합니다.
            pm2 reload ledgerrection || pm2 start .output/server/index.mjs --name "ledgerrection" --env PORT=${{ secrets.APP_PORT || 3000 }}
